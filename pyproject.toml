
[project]
name = "validabr"
version = "1.1.0"
description = "Enterprise toolkit for validating, parsing, enriching, and anonymizing Brazilian documents (LGPD-ready)"
readme = "README.md"
authors = [
    { name = "victor", email = "vitiportelada@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
django = ["django>=5.0"]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
pydantic = ["pydantic>=2.0"]

[project.scripts]
validabr = "validabr.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.0.2",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.8",
    "streamlit>=1.55.0",
    "watchdog>=6.0.0",
]
polars = [
    "polars>=1.39.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E402"]  # Django tests require setup before imports
per-file-ignores = { "tests/**/*.py" = ["N806", "E402", "RUF100"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "validabr.integrations.polars"
ignore_errors = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
build_command = "uv build"
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
